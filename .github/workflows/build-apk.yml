name: Build & Release Android APK

on:
  push:
    tags:
      - 'app-v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - release
          - debug

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile_app/package-lock.json

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Mobile App Dependencies
        working-directory: mobile_app
        run: npm ci

      - name: Regenerate config.json for Linux paths
        working-directory: mobile_app
        run: npx react-native config > config.json

      - name: Set up Python (for model packaging)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Package ONNX Models into Android Assets
        run: |
          if [ -d "ai_core/exported_models" ]; then
            echo "[MOD-04] Found exported_models — packaging into Android assets..."
            python ai_core/package_models.py
          else
            echo "[MOD-04] WARNING: ai_core/exported_models not found."
            echo "APK will build without on-device AI model weights."
            echo "Run export scripts first if you need a fully functional APK."
          fi

      - name: Grant Execute Permission to Gradle Wrapper
        working-directory: mobile_app/android
        run: chmod +x gradlew

      - name: Build Android APK
        working-directory: mobile_app/android
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Locate Output APK
        id: find-apk
        run: |
          APK_PATH=$(find mobile_app/android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bsmart-mobile-apk
          path: ${{ steps.find-apk.outputs.apk_path }}
          retention-days: 14

      - name: Create GitHub Release and Attach APK
        if: startsWith(github.ref, 'refs/tags/app-v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find-apk.outputs.apk_path }}
          draft: false
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
