[platformio]
src_dir = esp32_sense

[env:esp32s3cam]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
upload_port = COM7
monitor_port = COM7
monitor_speed = 115200
upload_speed = 921600

; Cấu hình chip ESP32-S3-N16R8 (16MB Flash, 8MB Octal PSRAM)
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_build.partitions = default_8MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0

lib_deps =
    esp32-camera
